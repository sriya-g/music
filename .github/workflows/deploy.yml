name: Deploy to Nextcloud Server

on:
  push:
    branches:
      - listenbrainz-support
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Nextcloud AIO
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_TAILSCALE_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "==> Updating Music app..."
            # Fetch latest commits and reset to clean state using docker container
            docker run --rm \
              -v nextcloud_aio_nextcloud:/volume \
              -w /volume/custom_apps/music \
              alpine/git \
              sh -c "git config --global --add safe.directory /volume/custom_apps/music && git fetch origin listenbrainz-support && git reset --hard origin/listenbrainz-support"

            # Ensure proper www-data ownership
            docker exec nextcloud-aio-nextcloud chown -R www-data:www-data /var/www/html/custom_apps/music

            # Complete any pending app migrations/upgrades and enable
            docker exec --user www-data nextcloud-aio-nextcloud php occ upgrade --no-interaction
            docker exec --user www-data nextcloud-aio-nextcloud php occ app:enable music
            echo "==> Deployment completed successfully!"
